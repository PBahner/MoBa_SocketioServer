<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modellbahn Steuerung</title>
    <style>
        .button-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .switch-button {
            padding: 10px;
            margin: 15px 10px;
            border: none;
            color: white;
            font: bold 18px bahnschrift,arial;
            border-radius: 6px;
            &.pos-minus {
                background-color: #772222;
                &:hover {
                    background-color: #600000;
                }
            }
            &.pos-plus {
                background-color: #227722;
                &:hover {
                    background-color: #006000;
                }
            }
            &:not(.pos-plus):not(.pos-minus) {
                background-color: #777777;
                &:hover {
                    background-color: #606060;
                }
            }
        }
    </style>
</head>
<body>
    <div class="button-wrapper">
        <button class="switch-button" id="switch-1">Weiche 1</button>
        <button class="switch-button" id="switch-2">Weiche 2</button>
        <button class="switch-button" id="switch-3">Weiche 3</button>
        <button class="switch-button" id="switch-4">Weiche 4</button>
        <button class="switch-button" id="switch-5">Weiche 5</button>
        <button class="switch-button" id="switch-6">Weiche 6</button>
        <button class="switch-button" id="switch-7">Weiche 7</button>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
        <script>eruda.init();</script>
    <script>
        // Connect to raw WebSocket server
        const ws = new WebSocket("ws://socketio-host:5000");

        ws.onopen = () => {
            console.log("WebSocket connected");
        };

        ws.onclose = () => {
            console.log("WebSocket disconnected");
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
        };

        ws.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);

                // expect messages with structure like: { "msg_id": "...", "data": {...} }
                if (message.msg_id === "update_switch_positions" ||
                    message.msg_id === "init_switch_positions") {
                    drawSwitchPositions(message);
                }
            } catch (err) {
                console.error("Invalid message:", event.data, err);
            }
        };

        function drawSwitchPositions(data) {
            Object.keys(data["data"]).forEach((turnout) => {
                turnout = parseInt(turnout);
                const element = document.getElementById("switch-" + (turnout + 1));

                switch (data["data"][turnout]) {
                    case 1:
                        element.classList.remove("pos-plus");
                        element.classList.add("pos-minus");
                        break;
                    case 0:
                        element.classList.remove("pos-minus");
                        element.classList.add("pos-plus");
                        break;
                    default:
                        element.classList.remove("pos-minus");
                        element.classList.remove("pos-plus");
                        break;
                }
            });
        }

        // Handle button clicks and send messages
        const buttons = document.getElementsByClassName("switch-button");
        for (const button of buttons) {
            button.addEventListener("click", (event) => {
                const turnout_id = event.target.id.split("-")[1] - 1;

                const message = {
                    msg_id: "change_turnouts",
                    data: [turnout_id]
                };

                ws.send(JSON.stringify(message));
                console.log("Sent:", message);
            });
        }
    </script>
</body>
</html>
